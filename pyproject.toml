[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrouter"
version = "0.1.0"
description = "Lightweight Python client library for AgentRouter (gpt-6.1-sol, gpt-6-astra, gpt-5.6-sol)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shrinivas"}
]
urls = {Homepage = "https://github.com/sinugowde/AgentRouter", Repository = "https://github.com/sinugowde/AgentRouter"}
keywords = ["agentrouter", "llm", "ai", "gpt-6.1-sol", "gpt-6-astra", "anthropic", "langchain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
anthropic = ["anthropic>=0.20.0"]
all = ["langchain-core>=0.2.0", "anthropic>=0.20.0"]

[project.scripts]
agentrouter = "agentrouter.cli:main"
